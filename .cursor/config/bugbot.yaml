# Bugbot reads this file from the pull request base branch.
# everyPush = one review per new head. Lint in GitHub Actions is the gate before review.
version: 1

triggers:
  drafts: false
  frequency: everyPush

review:
  effort: default
  incremental: true

prSummary:
  mode: disabled
  riskScore: false

autofix:
  mode: disabled
